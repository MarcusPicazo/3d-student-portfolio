            -webkit-font-smoothing: antialiased;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><polygon points="2,2 20,20 13,20 17,27 14,28 10,21 4,27" fill="%23D4B895" stroke="%234A2F1D" stroke-width="2" stroke-linejoin="round"/></svg>') 2 2, auto !important;
        }

        /* Cursor café oscuro tostado para elementos interactivos */
        a, button, input, select, textarea, .cursor-pointer {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><polygon points="2,2 20,20 13,20 17,27 14,28 10,21 4,27" fill="%238B5A2B" stroke="%232D180A" stroke-width="2" stroke-linejoin="round"/></svg>') 2 2, pointer !important;

        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .glass-panel {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-card {
            transition: all 0.3s ease;
            background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
        }
        .story-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(to bottom, rgba(255,255,255,0.04), transparent);
        }

        .noise-overlay {

            opacity: 0.015;
            pointer-events: none;
            z-index: -1;
        }

            content: ''; position: absolute; bottom: -4px; left: 0; width: 0%; height: 1px;
            background-color: #fff; transition: width 0.3s ease;
        }
        .nav-link.active::after { width: 100%; }
        .nav-link.active { color: #fff; }
    </style>

        // --- SISTEMA DE RENDERIZADO Y NAVEGACIÓN ---
        const container = document.getElementById('app-container');
        const navbar = document.getElementById('navbar');
        const mobileMenu = document.getElementById('mobile-menu');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('glass-panel', 'py-4');
                navbar.classList.remove('py-6', 'bg-transparent');
            } else {
                navbar.classList.remove('glass-panel', 'py-4');
                navbar.classList.add('py-6', 'bg-transparent');
            }
        });

        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        function updateActiveNav(viewId) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.target === viewId) {
                    btn.classList.add('active', 'text-white');
                    btn.classList.remove('text-textMuted');
                } else {
                    btn.classList.remove('active', 'text-white');
                    btn.classList.add('text-textMuted');
                }
            });
        }

        window.navigate = function(view, id = null, scroll = true) {
            if(scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
            mobileMenu.classList.add('hidden');
            
            updateActiveNav(view === 'storyDetail' ? 'stories' : view);
            container.dataset.view = view;
            container.dataset.id = id || "";
            container.innerHTML = ''; 
            
            switch(view) {
                case 'home': renderHome(); break;
                case 'stories': renderStories(); break;
                case 'storyDetail': renderStoryDetail(id); break;
                case 'submit': renderSubmit(); break;
                case 'trending': renderTrending(); break;
                case 'community': renderCommunity(); break;
                default: renderHome();
            }
        };

        // --- COMPONENTES ---

        function getCatName(idx) {
            return i18n[currentLang].cats[idx] || "Category";
        }

        function createStoryCardHTML(story) {
            return `
                <div onclick="navigate('storyDetail', ${story.id})" class="story-card border border-white/5 p-8 cursor-pointer h-full flex flex-col">
                    <div class="flex flex-col flex-grow justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-[10px] uppercase tracking-[0.2em] text-textMuted">
                                    ${getCatName(story.catIdx)}
                               </span>
                               ${story.trending ? `<i class="ph-fill ph-fire text-white/40 text-sm"></i>` : ''}
                            </div>
                            <h3 class="text-xl font-serif text-white/90 mb-4 leading-snug">
                                ${story.title[currentLang] || story.title.es}
                            </h3>
                            <p class="text-textMuted text-sm line-clamp-3 leading-relaxed font-light">
                                ${story.excerpt[currentLang] || story.excerpt.es}
                            </p>
                        </div>
                        <div class="flex items-center justify-between text-xs text-textMuted pt-6 mt-6 border-t border-white/5">
                            <span class="tracking-wide">${story.author}</span>
                            <div class="flex items-center gap-4">
                                <span class="flex items-center gap-1.5"><i class="ph ph-heart"></i> ${story.likes}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- VISTAS ---

        function renderHome() {
            const featuredStories = stories.slice(0, 3).map(createStoryCardHTML).join('');
            
            container.innerHTML = `
                <div class="fade-in">
                    <!-- Hero -->
                    <section class="relative min-h-screen flex items-center justify-center px-6">
                        <div class="relative z-10 text-center max-w-3xl mx-auto flex flex-col items-center">
                            <h1 class="text-4xl md:text-6xl font-serif text-white/90 mb-6 leading-tight tracking-wide">
                                ${t('hero_t1')} <br/>
                                <span class="italic text-white/60">${t('hero_t2')}</span>
                            </h1>
                            <p class="text-sm md:text-base text-textMuted mb-12 max-w-xl mx-auto font-light leading-relaxed">

                                </button>
                                <button onclick="navigate('submit')" class="px-10 py-3 bg-transparent border border-white/20 text-white text-xs uppercase tracking-[0.2em] hover:bg-white/5 transition-colors w-full sm:w-auto">
                                    ${t('btn_add')}
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Featured Section -->
                    <section class="py-24 px-6 relative z-10 border-t border-borderGray bg-surface/50">

                                <div>
                                    <h2 class="text-2xl font-serif text-white/90 mb-2">${t('home_recent')}</h2>

        window.setCategoryFilter = function(idx) {
            currentCategoryFilter = idx;
            renderStories(); 
        }

        function renderStories() {
            const categories = i18n[currentLang].cats;
            
            const filterButtonsHTML = categories.map((cat, idx) => {
                const isActive = currentCategoryFilter === idx;
                const activeClasses = isActive ? 'text-white border-b border-white' : 'text-textMuted hover:text-white';
                return `<button onclick="setCategoryFilter(${idx})" class="pb-1 text-xs uppercase tracking-widest transition-colors ${activeClasses}">${cat}</button>`;
            }).join('');

            const filteredStories = currentCategoryFilter === 0 
                ? stories 
                : stories.filter(s => s.catIdx === currentCategoryFilter);

            const storiesHTML = filteredStories.length > 0 
                ? filteredStories.map(createStoryCardHTML).join('')
                : `<div class="col-span-full text-center py-20 text-textMuted"><p class="text-sm font-light uppercase tracking-widest">${t('arc_empty')}</p></div>`;

            container.innerHTML = `
                <div class="pt-36 pb-24 px-6 max-w-6xl mx-auto fade-in">
                    <div class="mb-16">
                        <h1 class="text-3xl font-serif text-white/90 mb-4">${t('arc_title')}</h1>
                        <p class="text-sm text-textMuted font-light">${t('arc_sub')}</p>
                    </div>

                    <div class="flex flex-wrap gap-8 mb-12 border-b border-white/5 pb-4">
                        ${filterButtonsHTML}
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${storiesHTML}
                    </div>
                </div>
            `;
        }

        window.likeStory = function(id, btnElement) {
            const story = stories.find(s => s.id === id);
            if (story && !btnElement.classList.contains('liked')) {
                story.likes += 1;
                btnElement.classList.add('liked');
                btnElement.classList.remove('text-textMuted', 'border-white/20', 'bg-transparent');
                btnElement.classList.add('bg-white', 'text-black', 'border-white');
                
                const icon = btnElement.querySelector('i');
                icon.classList.remove('ph');
                icon.classList.add('ph-fill');
                
                const counter = btnElement.querySelector('span');
                counter.innerText = story.likes;
            }
        }

        function renderStoryDetail(id) {
            const story = stories.find(s => s.id === id);
            if (!story) return navigate('stories');

            const contentLines = (story.content[currentLang] || story.content.es).split('\n\n').join('</p><p class="mb-6">');

            container.innerHTML = `
                <div class="pt-36 pb-24 px-6 max-w-2xl mx-auto fade-in">
                    <button onclick="navigate('stories')" class="flex items-center gap-2 text-xs uppercase tracking-widest text-textMuted hover:text-white mb-12 transition-colors">
                        <i class="ph ph-arrow-left"></i> ${t('det_back')}
                    </button>

                    <article>
                        <header class="mb-12">
                            <div class="flex items-center gap-4 mb-8">
                                <span class="text-[10px] uppercase tracking-[0.2em] text-textMuted border border-white/10 px-2 py-1">
                                    ${getCatName(story.catIdx)}
                                </span>
                                <span class="text-xs text-textMuted">${story.date}</span>
                            </div>
                            <h1 class="text-3xl md:text-4xl font-serif text-white/90 leading-tight mb-8">
                                ${story.title[currentLang] || story.title.es}
                            </h1>
                            <div class="flex items-center justify-between pb-6 border-b border-white/5">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded bg-borderGray flex items-center justify-center">
                                        <i class="ph ph-user text-textMuted"></i>
                                    </div>
                                    <span class="text-sm text-gray-300">${story.author}</span>
                                </div>
                                <span class="text-xs text-textMuted flex items-center gap-2">
                                    <i class="ph ph-eye"></i> ${story.views} ${t('det_views')}
                                </span>
                            </div>
                        </header>

                        <div class="text-gray-300 leading-relaxed font-light text-base md:text-lg mb-16">
                            <p>${contentLines}</p>
                        </div>

                        <div class="flex items-center justify-center">
                            <button onclick="likeStory(${story.id}, this)" class="flex items-center gap-3 px-8 py-3 text-xs uppercase tracking-widest transition-colors duration-300 bg-transparent text-textMuted border border-white/20 hover:border-white/50">
                                <i class="ph ph-bookmark-simple text-lg"></i>
                                ${t('det_save')}
                                <span class="ml-2 opacity-70">${story.likes}</span>
                            </button>
                        </div>
                    </article>
                </div>
            `;
        }

        window.submitNewStory = function(event) {
            event.preventDefault();
            const form = event.target;
            const newStory = {
                id: Date.now(),
                catIdx: parseInt(form.category.value),
                author: form.author.value || "Anonymous",
                date: "2026",
                likes: 0, views: 0, trending: false,
                title: { es: form.title.value, en: form.title.value, fr: form.title.value, pt: form.title.value },
                excerpt: { es: form.content.value.substring(0, 100) + '...', en: form.content.value.substring(0, 100) + '...', fr: form.content.value.substring(0, 100) + '...', pt: form.content.value.substring(0, 100) + '...' },
                content: { es: form.content.value, en: form.content.value, fr: form.content.value, pt: form.content.value }
            };

            stories.unshift(newStory);

            const formContainer = document.getElementById('submit-container');
            formContainer.innerHTML = `
                <div class="border border-white/10 p-12 text-center fade-in bg-white/5">
                    <i class="ph ph-check text-3xl text-white/60 mb-6 block"></i>
                    <h2 class="text-xl font-serif text-white/90 mb-2">Success</h2>
                    <p class="text-sm text-textMuted font-light">Redirecting...</p>
                </div>
            `;
            setTimeout(() => navigate('stories'), 1500);
        }

        function renderSubmit() {
            const cats = i18n[currentLang].cats.slice(1); // Omit "Todos"
            const options = cats.map((c, i) => `<option value="${i+1}">${c}</option>`).join('');

            container.innerHTML = `
                <div class="pt-36 pb-24 px-6 max-w-xl mx-auto fade-in" id="submit-container">
                    <div class="mb-12">
                        <h1 class="text-3xl font-serif text-white/90 mb-4">${t('form_t1')}</h1>
                        <p class="text-sm text-textMuted font-light">${t('form_sub')}</p>
                    </div>
                    <form onsubmit="submitNewStory(event)" class="space-y-8 border-t border-white/5 pt-8">
                        <div>
                            <label class="block text-[10px] uppercase tracking-[0.2em] text-textMuted mb-3">${t('form_l1')}</label>
                            <input name="title" type="text" required class="w-full bg-transparent border-b border-white/20 pb-2 text-white text-lg focus:outline-none focus:border-white transition-colors">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label class="block text-[10px] uppercase tracking-[0.2em] text-textMuted mb-3">${t('form_l2')}</label>
                                <select name="category" class="w-full bg-dark border-b border-white/20 pb-2 text-white focus:outline-none focus:border-white transition-colors cursor-pointer text-sm">
                                    ${options}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase tracking-[0.2em] text-textMuted mb-3">${t('form_l3')}</label>
                                <input name="author" type="text" class="w-full bg-transparent border-b border-white/20 pb-2 text-white text-sm focus:outline-none focus:border-white transition-colors">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-[0.2em] text-textMuted mb-3">${t('form_l4')}</label>
                            <textarea name="content" required rows="10" class="w-full bg-transparent border border-white/10 p-4 text-white text-sm focus:outline-none focus:border-white/40 transition-colors resize-none font-light leading-relaxed"></textarea>
                        </div>
                        <div class="pt-4">
                            <button type="submit" class="w-full bg-white text-black text-xs uppercase tracking-[0.2em] font-medium py-4 hover:bg-gray-200 transition-colors">
                                ${t('form_btn')}
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderTrending() {
            const topStories = [...stories].sort((a, b) => b.likes - a.likes).slice(0, 10);
            
            const listHTML = topStories.map((story, index) => `
                <div onclick="navigate('storyDetail', ${story.id})" class="flex items-center gap-6 py-6 border-b border-white/5 cursor-pointer hover:bg-white/[0.02] px-4 transition-colors group">
                    <div class="text-sm font-serif text-textMuted w-8 text-center group-hover:text-white transition-colors">
                        ${(index + 1).toString().padStart(2, '0')}
                    </div>
                    <div class="flex-grow">
                        <h3 class="text-lg font-serif text-white/80 mb-1 group-hover:text-white transition-colors">${story.title[currentLang] || story.title.es}</h3>
                        <p class="text-xs text-textMuted tracking-wide">Ref: ${story.author}</p>
                    </div>
                    <div class="text-xs text-textMuted flex items-center gap-2">
                        <i class="ph-fill ph-bookmark-simple"></i> ${story.likes}
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="pt-36 pb-24 px-6 max-w-3xl mx-auto fade-in">
                    <div class="mb-16">
                        <h1 class="text-3xl font-serif text-white/90 mb-4">${t('trend_title')}</h1>
                        <p class="text-sm text-textMuted font-light">${t('trend_sub')}</p>
                    </div>
                    <div class="border-t border-white/10">
                        ${listHTML}
                    </div>
                </div>
            `;
        }

        function renderCommunity() {
            const mockActivity = [
                { user: "Usuario_09", action: "log", target: "El vagón vacío", time: t('time_now') },
                { user: "InvestigadorX", action: "log", target: "El archivo oculto", time: "15 min" },
                { user: "Sleepless", action: "log", target: "El Retrato", time: "1h" },
            ];

            const actHTML = mockActivity.map(act => `
                <div class="py-4 border-b border-white/5 last:border-0">
                    <p class="text-sm text-gray-300 font-light">
                        <span class="text-white/90 font-medium">${act.user}</span> <span class="text-textMuted italic">-> ${act.target}</span>
                    </p>
                    <span class="text-[10px] uppercase tracking-widest text-gray-600 mt-2 block">${act.time}</span>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="pt-36 pb-24 px-6 max-w-4xl mx-auto fade-in">
                    <div class="mb-16">
                        <h1 class="text-3xl font-serif text-white/90 mb-4">${t('com_title')}</h1>
                        <p class="text-sm text-textMuted font-light">${t('com_sub')}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                        <div>
                            <h2 class="text-xs uppercase tracking-[0.2em] text-textMuted mb-6 border-b border-white/10 pb-4">${t('com_moves')}</h2>
                            <div>${actHTML}</div>
                        </div>
                        <div>
                            <h2 class="text-xs uppercase tracking-[0.2em] text-textMuted mb-6 border-b border-white/10 pb-4">${t('com_nodes')}</h2>
                            <div class="space-y-4">
                                ${["Watcher_01", "NightOwl", "Ocultista", "SeñalPerdida"].map(name => `
                                    <div class="flex items-center justify-between text-sm">
                                        <span class="text-gray-300">${name}</span>
                                        <div class="flex items-center gap-2">
                                            <span class="w-2 h-2 rounded-full bg-white/40"></span>
                                            <span class="text-[10px] text-textMuted uppercase">${t('com_online')}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- THREE.JS BACKGROUND ---
        let scene, camera, renderer, particles;
        let targetScrollY = 0, currentScrollY = 0;

        function initThreeJS() {
            const canvas = document.getElementById('bg-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030303, 0.05);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = window.innerWidth < 768 ? 800 : 1500; 
            const posArray = new Float32Array(particlesCount * 3);
            const colorsArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i+=3) {
                posArray[i] = (Math.random() - 0.5) * 25;     
                posArray[i+1] = (Math.random() - 0.5) * 25;   
                posArray[i+2] = (Math.random() - 0.5) * 20;   
                const shade = 0.2 + Math.random() * 0.4; 
                colorsArray[i] = shade; colorsArray[i+1] = shade; colorsArray[i+2] = shade;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.02, vertexColors: true, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);
            camera.position.z = 8;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animateThreeJS();
        }

        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);
            particles.rotation.y += 0.0002;
            particles.rotation.x += 0.0001;
            currentScrollY += (targetScrollY - currentScrollY) * 0.05;
            camera.position.y = -(currentScrollY * 0.001);
            camera.position.z = 8 - (currentScrollY * 0.0005);
            renderer.render(scene, camera);
        }

        window.addEventListener('scroll', () => targetScrollY = window.scrollY);

        // --- INICIALIZACIÓN ---
        window.onload = () => {
            initThreeJS();
            updateStaticTranslations();
            navigate('home'); 
        };
    </script>
