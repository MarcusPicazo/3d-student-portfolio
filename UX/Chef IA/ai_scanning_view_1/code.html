<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SmartChef AI - Ingredient Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#e0e3e5",
              "surface-tint": "#006d36",
              "inverse-on-surface": "#eff1f3",
              "tertiary": "#895024",
              "primary-fixed-dim": "#4de082",
              "on-tertiary-container": "#794418",
              "outline": "#6d7b6d",
              "outline-variant": "#bccabb",
              "tertiary-container": "#ffb47f",
              "on-tertiary-fixed-variant": "#6c3a0f",
              "error-container": "#ffdad6",
              "on-surface-variant": "#3d4a3e",
              "surface-dim": "#d8dadc",
              "primary-container": "#4ade80",
              "on-tertiary": "#ffffff",
              "on-background": "#191c1e",
              "on-primary-fixed": "#00210c",
              "secondary-container": "#fd933d",
              "surface-container": "#eceef0",
              "on-error": "#ffffff",
              "surface-container-low": "#f2f4f6",
              "secondary": "#944a00",
              "tertiary-fixed-dim": "#ffb784",
              "on-secondary-container": "#693300",
              "primary-fixed": "#6dfe9c",
              "on-secondary": "#ffffff",
              "on-primary-container": "#005e2d",
              "on-error-container": "#93000a",
              "inverse-primary": "#4de082",
              "secondary-fixed-dim": "#ffb783",
              "surface-container-highest": "#e0e3e5",
              "on-secondary-fixed-variant": "#713700",
              "background": "#f7f9fb",
              "on-primary": "#ffffff",
              "surface-container-high": "#e6e8ea",
              "surface-bright": "#f7f9fb",
              "error": "#ba1a1a",
              "primary": "#006d36",
              "surface": "#f7f9fb",
              "on-primary-fixed-variant": "#005227",
              "on-surface": "#191c1e",
              "on-secondary-fixed": "#301400",
              "on-tertiary-fixed": "#301400",
              "tertiary-fixed": "#ffdcc6",
              "surface-container-lowest": "#ffffff",
              "inverse-surface": "#2d3133",
              "secondary-fixed": "#ffdcc5"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #4ade80, transparent);
            box-shadow: 0 0 15px #4ade80;
            position: absolute;
            width: 100%;
            top: 50%;
        }
        .scan-pulse {
            border: 2px solid #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="close-up portrait of a professional chef smiling in a bright modern kitchen environment, soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3b9JtrsfLPSq8jf-W91lBYVTerOTNZqZWVOJMwYfIo-TtKXkUr8OrBY3bhEh48UiRs5mfN4eV2aNUSF8DT4wuoBnVmcexUldmPyXXOps5m6Bni4gUDlX9N1ITBiA7wfWd6DZgTqzp5LWfBCMo5mJEbtZAagzOMrrlGFcEWmXCpINKELGbKZxageetFhWKQnivMzaBq6ekXw4EO-B7PdQKJDDmxZLd3KtxDJoWK9-toioUGCD2pKMSTknPO2AREhQbgrwFMVbcXAM"/>
</div>
<h1 class="text-xl font-black text-emerald-800 dark:text-emerald-200 tracking-tight font-headline">SmartChef AI</h1>
</div>
<button class="text-emerald-700 dark:text-emerald-400 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Camera Viewfinder / Main Canvas -->
<main class="relative h-screen w-full pt-16 pb-32">
<!-- Background Image (Simulated Camera Feed) -->
<div class="absolute inset-0 z-0">
<img alt="Kitchen Counter Ingredients" class="w-full h-full object-cover" data-alt="top-down cinematic view of fresh ingredients like bell peppers, tomatoes, and herbs scattered on a clean marble kitchen countertop with natural sunlight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBnrThST2w2JUsCbi-uUXOj2M-PlhorA1743npstnMdBNNf-5YDD-zlhRb5RN67hjIuvazxqQTDKfMWk1Tawhp-OlUl_BqfdPrkFx7gmy_2Y0Qa0D8XXw_d0lTH8LOoRjKkkN0s32PL8vey9XQRyW1ns-CU1WaQhrNaJMlpMmLqP1-dBOnKi9XJ3p19JALoPaGakz2Fd6hNjRJvN0RWxk4-zpEwb2c0HLVSO3o_1qs4LiPdujtbAJeaxol98yYiautVfvrZkdlg24"/>
<!-- Dark Overlay for Readability -->
<div class="absolute inset-0 bg-black/20"></div>
</div>
<!-- Scanning Animation Elements -->
<div class="absolute inset-0 z-10 pointer-events-none">
<!-- Animated Scan Line -->
<div class="scanner-line"></div>
<!-- Detected Ingredient 1: Tomato -->
<div class="absolute top-[35%] left-[20%] group">
<div class="scan-pulse w-32 h-32 rounded-xl mb-3 flex items-center justify-center">
<div class="bg-primary/80 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-2">
<span class="w-2 h-2 bg-primary-container rounded-full"></span>
<span class="text-white text-xs font-bold font-label">Tomato</span>
</div>
</div>
</div>
<!-- Detected Ingredient 2: Bell Pepper -->
<div class="absolute top-[55%] right-[15%] group">
<div class="scan-pulse w-40 h-40 rounded-xl mb-3 flex items-center justify-center">
<div class="bg-primary/80 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-2">
<span class="w-2 h-2 bg-primary-container rounded-full"></span>
<span class="text-white text-xs font-bold font-label">Bell Pepper</span>
</div>
</div>
</div>
<!-- Detected Ingredient 3: Garlic -->
<div class="absolute top-[25%] right-[25%] group">
<div class="scan-pulse w-24 h-24 rounded-full mb-3 flex items-center justify-center border-dashed">
<div class="bg-primary/80 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-2">
<span class="w-2 h-2 bg-primary-container rounded-full"></span>
<span class="text-white text-xs font-bold font-label">Garlic</span>
</div>
</div>
</div>
</div>
<!-- Scanning Status Indicator -->
<div class="absolute top-24 left-1/2 -translate-x-1/2 z-20 w-max">
<div class="bg-surface-container-lowest/90 backdrop-blur-xl px-6 py-3 rounded-full shadow-xl flex items-center gap-4">
<div class="w-3 h-3 bg-primary rounded-full animate-pulse"></div>
<p class="text-on-surface font-semibold text-sm font-label">AI Scanning Active...</p>
</div>
</div>
<!-- Floating Action Footer Overlay -->
<div class="absolute bottom-32 left-0 w-full px-6 z-30">
<div class="bg-surface-container-lowest/95 backdrop-blur-2xl p-6 rounded-xl shadow-2xl space-y-4">
<div class="flex items-center justify-between">
<h3 class="font-headline font-bold text-on-surface text-lg">Detected (5)</h3>
<button class="text-primary text-sm font-bold font-label hover:opacity-70 transition-opacity">
                        Manual Edit
                    </button>
</div>
<div class="flex flex-wrap gap-2">
<div class="bg-primary-container/30 text-on-primary-container px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                        Tomato <span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</div>
<div class="bg-primary-container/30 text-on-primary-container px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                        Bell Pepper <span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</div>
<div class="bg-primary-container/30 text-on-primary-container px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                        Garlic <span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</div>
<div class="bg-primary-container/30 text-on-primary-container px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                        Onion <span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</div>
<div class="bg-primary-container/30 text-on-primary-container px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                        Olive Oil <span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</div>
</div>
<button class="w-full bg-secondary-container hover:opacity-90 active:scale-[0.98] transition-all text-on-secondary-container font-bold py-4 rounded-full flex items-center justify-center gap-3 shadow-lg">
<span class="material-symbols-outlined" data-icon="restaurant" data-weight="fill" style="font-variation-settings: 'FILL' 1;">restaurant</span>
                    Confirm 5 ingredients
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-t-[32px] z-50 shadow-[0_-20px_40px_rgba(0,0,0,0.04)]">
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-2 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-full transition-all" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-inter text-[11px] font-semibold tracking-wide">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-2 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-full transition-all" href="#">
<span class="material-symbols-outlined" data-icon="bookmark">bookmark</span>
<span class="font-inter text-[11px] font-semibold tracking-wide">Saved</span>
</a>
<a class="flex flex-col items-center justify-center bg-emerald-100 dark:bg-emerald-900/40 text-emerald-900 dark:text-emerald-100 rounded-full px-5 py-2 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="installs">install_mobile</span>
<span class="font-inter text-[11px] font-semibold tracking-wide">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-2 hover:bg-slate-100 dark:hover:bg-slate-800/50 rounded-full transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-inter text-[11px] font-semibold tracking-wide">Profile</span>
</a>
</nav>
<!-- Background Camera Shutter Effect Overlay (Optional Flash UI) -->
<div class="fixed inset-0 pointer-events-none z-[100] opacity-0 bg-white" id="flash-effect"></div>
</body></html>
