<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Cat Blaster - Misión Récord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background-color: #1a1a2e;
            user-select: none;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: none;
            background: radial-gradient(circle at center, #2e1a47 0%, #1a1a2e 100%);
            overflow: hidden;
        }

        #game-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .star-decor {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            pointer-events: none;
            animation: blink 3s infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.3); }
        }

        #custom-cursor {
            position: fixed;
            width: 70px;
            height: 70px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 5000; /* Por encima de todo */
            font-size: 50px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
        }

        .hand-click {
            transform: translate(-50%, -50%) scale(0.8) rotate(-15deg) !important;
        }

        /* --- HUD --- */
        .hud-container {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 25px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 100px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: -2px;
        }

        .stat-value {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #fff;
        }

        /* --- GATITOS --- */
        .cat-container {
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            z-index: 10;
        }

        .cat-sprite {
            position: relative;
            width: 90px;
            height: 80px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        /* Estilos de los gatos (cuerpo, cabeza, orejas) igual que antes */
        .cat-head { position: absolute; width: 75px; height: 60px; border-radius: 50% 50% 48% 48%; top: 2px; left: 7.5px; z-index: 5; border: 2px solid rgba(255,255,255,0.4); }
        .cat-body { position: absolute; width: 65px; height: 45px; border-radius: 40% 40% 50% 50%; bottom: 5px; left: 12.5px; z-index: 1; }
        .ear { position: absolute; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 22px solid currentColor; top: -12px; z-index: 4; }
        .ear.left { left: 12px; transform: rotate(-25deg); }
        .ear.right { right: 12px; transform: rotate(25deg); }
        .ear-in { position: absolute; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid #fff; opacity: 0.6; bottom: -20px; left: -7px; }
        .eye { position: absolute; width: 11px; height: 11px; background: #222; border-radius: 50%; top: 25px; }
        .eye::before { content: ""; position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; top: 1.5px; left: 1.5px; }
        .eye.l { left: 18px; }
        .eye.r { right: 18px; }
        .blush { position: absolute; width: 15px; height: 8px; background: #ffb7c5; border-radius: 50%; top: 38px; opacity: 0.7; filter: blur(1px); }
        .nose { position: absolute; width: 8px; height: 5px; background: #ffb6c1; border-radius: 50%; top: 36px; left: 50%; transform: translateX(-50%); }
        .tail { position: absolute; width: 35px; height: 15px; border-radius: 15px; bottom: 20px; right: -5px; transform-origin: left center; animation: wag 1.2s infinite alternate ease-in-out; z-index: 0; }

        @keyframes wag { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
        @keyframes floatAnim { from { transform: translate(0, 0) rotate(-2deg); } to { transform: translate(0, -20px) rotate(2deg); } }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 40px;
        }

        /* --- BOTONES MEJORADOS --- */
        .game-btn {
            background: #ff69b4;
            color: white;
            border: 4px solid #fff; /* Borde blanco para visibilidad extrema */
            padding: 20px 80px;
            font-size: 42px;
            border-radius: 100px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            margin-top: 40px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 0 #d14d8d, 0 20px 40px rgba(255, 105, 180, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 5001; /* Asegurar que está sobre el overlay */
            pointer-events: auto !important; /* Forzar clics */
        }

        .game-btn:hover {
            transform: scale(1.1) translateY(-10px);
            background: #ff85c2;
            box-shadow: 0 15px 0 #d14d8d, 0 25px 50px rgba(255, 105, 180, 0.6);
        }

        .game-btn:active {
            transform: scale(0.95) translateY(5px);
            box-shadow: 0 5px 0 #d14d8d;
        }

        #start-screen { display: flex; }
        #end-screen { display: none; }

        h1, h2 {
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 28px;
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stars-layer"></div>
    <div id="custom-cursor">🐾</div>

    <!-- HUD (Puntos/Récord) siempre visible arriba -->
    <div class="hud-container">
        <div class="stat-card">
            <span class="stat-label">Puntos</span>
            <span id="score" class="stat-value" style="color: #ff69b4;">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Récord</span>
            <span id="high-score" class="stat-value" style="color: #ffbf00;">0</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Tiempo</span>
            <span id="timer" class="stat-value" style="color: #4facfe;">60</span>
        </div>
    </div>

    <!-- Pantalla de Inicio -->
    <div class="overlay" id="start-screen">
        <div class="modal">
            <h1 style="font-size: 80px; color: #ff69b4; font-family: 'Fredoka One', cursive; line-height: 1;">KAWAII CAT<br>BLASTER</h1>
            <p class="sub-text">¡Mima a todos los gatitos!</p>
            <button class="game-btn" onclick="startGame()">Inicio</button>
        </div>
    </div>

    <!-- Pantalla de Fin -->
    <div class="overlay" id="end-screen">
        <div class="modal">
            <h2 id="end-title" style="font-size: 60px; color: #ff69b4; font-family: 'Fredoka One', cursive;">¡TIEMPO FUERA!</h2>
            <div id="new-record-msg" style="color: #ffbf00; font-size: 32px; font-family: 'Fredoka One'; display:none; margin: 10px 0;">✨ ¡NUEVO RÉCORD! ✨</div>
            <p style="font-size: 40px; color: #fff; margin-top: 20px;">
                Mimos: <span id="final-score" style="color: #ff69b4;">0</span>
            </p>
            <p style="font-size: 24px; color: rgba(255,255,255,0.7); margin-bottom: 20px;">Mejor récord: <span id="modal-high-score">0</span></p>
            <button class="game-btn" onclick="startGame()">Reiniciar</button>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const scoreText = document.getElementById('score');
    const highScoreText = document.getElementById('high-score');
    const timerText = document.getElementById('timer');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const finalScoreText = document.getElementById('final-score');
    const modalHighScore = document.getElementById('modal-high-score');
    const recordMsg = document.getElementById('new-record-msg');
    const cursor = document.getElementById('custom-cursor');
    const starsLayer = document.getElementById('stars-layer');

    let points = 0;
    let seconds = 60;
    let highScore = localStorage.getItem('kawaiiCatScore') || 0;
    let isActive = false;
    let gameLoop;
    let catSpawner;

    highScoreText.innerText = highScore;
    const colors = ['#FFD1DC', '#E0BBE4', '#BFFCC6', '#FFF5BA', '#AEC6CF', '#FFDFD3'];

    // Manejo del Cursor
    window.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        const tilt = (e.movementX > 0) ? 15 : (e.movementX < 0) ? -15 : 0;
        cursor.style.transform = `translate(-50%, -50%) rotate(${tilt}deg)`;
    });

    window.addEventListener('mousedown', () => cursor.classList.add('hand-click'));
    window.addEventListener('mouseup', () => cursor.classList.remove('hand-click'));

    function createBackgroundStars() {
        starsLayer.innerHTML = '';
        for(let i=0; i<70; i++) {
            const star = document.createElement('div');
            star.className = 'star-decor';
            const size = Math.random() * 3 + 2;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsLayer.appendChild(star);
        }
    }

    function createCat() {
        if (!isActive) return;

        const color = colors[Math.floor(Math.random() * colors.length)];
        const box = document.createElement('div');
        box.className = 'cat-container';
        
        const x = 50 + Math.random() * (window.innerWidth - 150);
        const y = 150 + Math.random() * (window.innerHeight - 300);

        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.transform = 'scale(0)';
        box.style.animation = `floatAnim ${2 + Math.random()}s infinite alternate ease-in-out`;

        box.innerHTML = `
            <div class="cat-sprite">
                <div class="tail" style="background: ${color}"></div>
                <div class="ear left" style="color: ${color}"><div class="ear-in"></div></div>
                <div class="ear right" style="color: ${color}"><div class="ear-in"></div></div>
                <div class="cat-body" style="background: ${color}"></div>
                <div class="cat-head" style="background: ${color}">
                    <div class="blush l"></div>
                    <div class="blush r"></div>
                    <div class="eye l"></div>
                    <div class="eye r"></div>
                    <div class="nose"></div>
                </div>
            </div>
        `;

        box.addEventListener('mousedown', (e) => {
            if (!isActive) return;
            e.stopPropagation();
            points++;
            scoreText.innerText = points;
            box.classList.add('happy');
            showPop(e.clientX, e.clientY, "+1");
            box.style.pointerEvents = 'none';
            box.style.transform = 'scale(1.4) translateY(-30px)';
            box.style.opacity = '0';
            setTimeout(() => box.remove(), 400);
        });

        container.appendChild(box);
        requestAnimationFrame(() => box.style.transform = 'scale(1)');

        const life = 2200 + Math.random() * 1800;
        setTimeout(() => {
            if (box.parentElement) {
                box.style.opacity = '0';
                box.style.transform = 'scale(0)';
                setTimeout(() => box.remove(), 600);
            }
        }, life);

        const delay = Math.max(250, 900 - (points * 6));
        catSpawner = setTimeout(createCat, delay);
    }

    function showPop(x, y, txt) {
        const t = document.createElement('div');
        t.style.position = 'absolute'; t.style.pointerEvents = 'none';
        t.style.left = x + 'px'; t.style.top = y + 'px';
        t.style.fontSize = '32px'; t.style.fontWeight = 'bold';
        t.style.color = '#fff'; t.style.textShadow = '0 0 10px rgba(255, 105, 180, 1)';
        t.style.zIndex = '100'; t.style.fontFamily = 'Fredoka One';
        t.innerText = txt;
        t.animate([{ transform: 'translateY(0) scale(0.5)', opacity: 1 }, { transform: 'translateY(-120px) scale(1.5)', opacity: 0 }], { duration: 800, easing: 'ease-out', fill: 'forwards' });
        container.appendChild(t);
        setTimeout(() => t.remove(), 800);
    }

    function startGame() {
        points = 0;
        seconds = 60;
        isActive = true;
        scoreText.innerText = points;
        timerText.innerText = seconds;
        startScreen.style.display = 'none';
        endScreen.style.display = 'none';
        recordMsg.style.display = 'none';
        
        document.querySelectorAll('.cat-container').forEach(c => c.remove());
        
        clearInterval(gameLoop);
        clearTimeout(catSpawner);

        gameLoop = setInterval(() => {
            seconds--;
            timerText.innerText = seconds;
            if (seconds <= 0) stopGame();
        }, 1000);

        createCat();
        setTimeout(createCat, 500);
    }

    function stopGame() {
        isActive = false;
        clearInterval(gameLoop);
        clearTimeout(catSpawner);
        
        finalScoreText.innerText = points;
        
        if (points > highScore) {
            highScore = points;
            localStorage.setItem('kawaiiCatScore', highScore);
            highScoreText.innerText = highScore;
            recordMsg.style.display = 'block';
            document.getElementById('end-title').innerText = "✨ NUEVO RÉCORD ✨";
        } else {
            document.getElementById('end-title').innerText = "¡TIEMPO FUERA!";
        }
        
        modalHighScore.innerText = highScore;
        endScreen.style.display = 'flex';
    }

    window.onload = () => {
        createBackgroundStars();
    };
</script>

</body>
</html>
