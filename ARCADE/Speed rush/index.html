<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carreras 3D - Tipo Need For Speed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importamos Three.js desde un CDN confiable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Color cielo diurno */
            touch-action: none; /* Previene scroll en móviles al tocar */
        }
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .interactive {
            pointer-events: auto;
        }
        /* Controles táctiles invisibles sobre la pantalla */
        .touch-zone {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 10;
        }
        #touchLeft { left: 0; }
        #touchRight { right: 0; }
    </style>
</head>
<body class="font-sans text-white select-none">

    <!-- Contenedor del Canvas 3D -->
    <canvas id="gameCanvas"></canvas>

    <!-- Zonas táctiles para móviles -->
    <div id="touchLeft" class="touch-zone interactive hidden"></div>
    <div id="touchRight" class="touch-zone interactive hidden"></div>

    <!-- Interfaz de Usuario (HUD y Menús) -->
    <div class="ui-layer p-4">
        <!-- HUD Superior -->
        <div id="hud" class="flex justify-between items-start hidden">
            <div class="bg-black/50 p-3 rounded-lg border border-white/20 backdrop-blur-sm shadow-lg">
                <div class="text-sm text-gray-300 font-bold uppercase tracking-wider">Distancia</div>
                <div id="scoreDisplay" class="text-3xl font-black text-white drop-shadow-md">0 <span class="text-lg">m</span></div>
            </div>
            <div class="bg-black/50 p-3 rounded-lg border border-white/20 backdrop-blur-sm shadow-lg text-right">
                <div class="text-sm text-gray-300 font-bold uppercase tracking-wider">Velocidad</div>
                <div id="speedDisplay" class="text-3xl font-black text-yellow-400 drop-shadow-md">0 <span class="text-lg">km/h</span></div>
            </div>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="startScreen" class="absolute inset-0 flex items-center justify-center bg-black/20 interactive backdrop-blur-md">
            <div class="text-center p-8 bg-gradient-to-b from-gray-900/90 to-black/90 rounded-2xl border border-gray-600 shadow-[0_0_50px_rgba(0,0,0,0.8)] max-w-md w-full mx-4">
                <h1 class="text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500 italic transform -skew-x-12">SPEED RUSH</h1>
                <p class="text-gray-400 mb-8 font-medium">Esquiva los obstáculos y llega lo más lejos posible.</p>
                
                <div class="mb-8 text-left bg-black/40 p-4 rounded-lg">
                    <h3 class="font-bold text-gray-300 mb-2">Controles:</h3>
                    <ul class="text-sm text-gray-400 space-y-2">
                        <li><kbd class="bg-gray-700 px-2 py-1 rounded">←</kbd> <kbd class="bg-gray-700 px-2 py-1 rounded">→</kbd> o <kbd class="bg-gray-700 px-2 py-1 rounded">A</kbd> <kbd class="bg-gray-700 px-2 py-1 rounded">D</kbd> para girar.</li>
                        <li>📱 Toca los lados de la pantalla en móviles.</li>
                    </ul>
                </div>

                <button id="startBtn" class="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black text-xl rounded-xl transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                    INICIAR CARRERA
                </button>
            </div>
        </div>

        <!-- Pantalla de Fin de Juego -->
        <div id="gameOverScreen" class="absolute inset-0 flex items-center justify-center bg-red-900/90 interactive backdrop-blur-md hidden">
            <div class="text-center p-8 bg-black rounded-2xl border-2 border-red-500 shadow-[0_0_30px_rgba(220,38,38,0.8)] max-w-md w-full mx-4 transform scale-100 transition-transform">
                <h2 class="text-5xl font-black mb-4 text-red-500">¡CHOQUE!</h2>
                <div class="bg-gray-900 p-4 rounded-lg mb-6">
                    <p class="text-gray-400 text-sm uppercase tracking-widest mb-1">Distancia Recorrida</p>
                    <p id="finalScore" class="text-4xl font-bold text-white">0 m</p>
                </div>
                <button id="restartBtn" class="w-full py-4 bg-white text-black hover:bg-gray-200 font-black text-xl rounded-xl transition-all transform hover:scale-105">
                    VOLVER A JUGAR
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- VARIABLES GLOBALES DEL JUEGO ---
        let scene, camera, renderer;
        let car, road;
        let obstacles = [];
        let environmentObjects = [];
        let startGroup;
        let startCameraAngle = 0;
        
        let gameState = 'start'; // start, playing, gameover
        let score = 0;
        let speed = 0;
        let baseSpeed = 1.0;
        let maxSpeed = 3.5;
        let speedMultiplier = 1;
        let laneWidth = 3;
        let roadWidth = 15;
        
        // Controles
        let keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };
        let touchInput = 0; // -1 izquierda, 0 centro, 1 derecha

        // Referencias del DOM
        const uiHUD = document.getElementById('hud');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const speedDisplay = document.getElementById('speedDisplay');
        const finalScore = document.getElementById('finalScore');
        const touchLeft = document.getElementById('touchLeft');
        const touchRight = document.getElementById('touchRight');

        // --- INICIALIZACIÓN DE THREE.JS ---
        function init() {
            const canvas = document.getElementById('gameCanvas');
            
            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Cielo azul
            scene.fog = new THREE.Fog(0x87CEEB, 50, 200); // Niebla para ocultar la generación

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 4, 10);
            camera.lookAt(0, 0, -20);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            scene.add(dirLight);

            // Crear el mundo
            createRoad();
            createEnvironment();
            createCar();
            createStartScreen3D();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
            document.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

            // Controles móviles táctiles
            touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); touchInput = -1; });
            touchLeft.addEventListener('touchend', (e) => { e.preventDefault(); touchInput = 0; });
            touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); touchInput = 1; });
            touchRight.addEventListener('touchend', (e) => { e.preventDefault(); touchInput = 0; });

            // Botones UI
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);

            // Iniciar ciclo de animación
            animate();
        }

        // --- CREACIÓN DE OBJETOS ---

        function createCar() {
            car = new THREE.Group();

            // Materiales
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xcc0000, shininess: 100 });
            const glassMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 90 });
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x222222 });

            // Chasis principal
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            car.add(body);

            // Cabina (vidrios)
            const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
            const cabin = new THREE.Mesh(cabinGeo, glassMat);
            cabin.position.set(0, 1.3, -0.2);
            cabin.castShadow = true;
            car.add(cabin);

            // Alerón trasero
            const spoilerGeo = new THREE.BoxGeometry(1.8, 0.1, 0.5);
            const spoiler = new THREE.Mesh(spoilerGeo, bodyMat);
            spoiler.position.set(0, 1.2, 1.8);
            spoiler.castShadow = true;
            car.add(spoiler);

            const spoilerSupportGeo = new THREE.BoxGeometry(0.1, 0.3, 0.2);
            const supL = new THREE.Mesh(spoilerSupportGeo, bodyMat);
            supL.position.set(-0.6, 1.05, 1.8);
            car.add(supL);
            const supR = new THREE.Mesh(spoilerSupportGeo, bodyMat);
            supR.position.set(0.6, 1.05, 1.8);
            car.add(supR);

            // Ruedas
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            
            const wheelPositions = [
                [-1.1, 0.4, -1.2], // Delantera Izquierda
                [ 1.1, 0.4, -1.2], // Delantera Derecha
                [-1.1, 0.4,  1.2], // Trasera Izquierda
                [ 1.1, 0.4,  1.2]  // Trasera Derecha
            ];

            car.wheels = [];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                car.add(wheel);
                car.wheels.push(wheel);
            });

            car.position.set(0, 0, 0);
            scene.add(car);
        }

        function createStartScreen3D() {
            startGroup = new THREE.Group();
            
            // 1. Plataforma de exhibición (Showroom) debajo del coche
            const platformGeo = new THREE.CylinderGeometry(4, 4.5, 0.5, 32);
            const platformMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 100 });
            const platform = new THREE.Mesh(platformGeo, platformMat);
            platform.position.y = -0.25; // Superficie en y=0
            startGroup.add(platform);

            // Anillo de neón brillante al borde de la plataforma
            const platformRingGeo = new THREE.TorusGeometry(4, 0.05, 16, 64);
            const platformRingMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const platformRing = new THREE.Mesh(platformRingGeo, platformRingMat);
            platformRing.rotation.x = Math.PI / 2;
            platformRing.position.y = 0;
            startGroup.add(platformRing);

            // 2. Elementos geométricos flotantes abstractos (Estilo Arcade/Cyberpunk)
            const shapes = [
                new THREE.IcosahedronGeometry(1.5, 0),
                new THREE.OctahedronGeometry(1.2, 0),
                new THREE.TorusGeometry(1, 0.4, 16, 32)
            ];
            // Se cambió el morado (0x9d00ff) por un azul neón (0x0066ff)
            const colors = [0xff0055, 0x00ffcc, 0xffaa00, 0x0066ff];

            for(let i=0; i<20; i++) {
                const shapeGeo = shapes[Math.floor(Math.random() * shapes.length)];
                const shapeMat = new THREE.MeshBasicMaterial({ 
                    color: colors[Math.floor(Math.random() * colors.length)], 
                    wireframe: true,
                    transparent: true,
                    opacity: 0.4
                });
                const mesh = new THREE.Mesh(shapeGeo, shapeMat);
                
                // Distribución en un anillo amplio alrededor del coche
                const angle = Math.random() * Math.PI * 2;
                const radius = 6 + Math.random() * 15;
                mesh.position.set(Math.cos(angle) * radius, Math.random() * 12 + 1, Math.sin(angle) * radius);
                
                // Rotaciones aleatorias iniciales
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                
                // Datos para animación
                mesh.userData = {
                    rotX: (Math.random() - 0.5) * 0.02,
                    rotY: (Math.random() - 0.5) * 0.02,
                    floatSpeed: Math.random() * 0.002 + 0.001,
                    floatOffset: Math.random() * Math.PI * 2,
                    baseY: mesh.position.y
                };
                startGroup.add(mesh);
            }

            // 3. Luces dinámicas giratorias (Neón)
            const light1 = new THREE.PointLight(0xff0055, 2, 20);
            const light2 = new THREE.PointLight(0x00ffcc, 2, 20);
            startGroup.add(light1);
            startGroup.add(light2);
            startGroup.userData.light1 = light1;
            startGroup.userData.light2 = light2;

            // 4. Partículas (Polvo de neón flotante)
            const particleGeo = new THREE.BufferGeometry();
            const particleCount = 300;
            const posArray = new Float32Array(particleCount * 3);
            for(let i=0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 40;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particleMat = new THREE.PointsMaterial({
                size: 0.1,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            startGroup.add(particles);
            startGroup.userData.particles = particles;

            scene.add(startGroup);
        }

        function createRoad() {
            // Textura procedural para la carretera (líneas discontinuas)
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 1024;
            const context = canvas.getContext('2d');
            
            // Asfalto oscuro
            context.fillStyle = '#333333';
            context.fillRect(0, 0, 512, 1024);
            
            // Líneas blancas centrales
            context.fillStyle = '#ffffff';
            context.fillRect(240, 0, 32, 300);
            context.fillRect(240, 512, 32, 300);
            
            // Líneas amarillas laterales
            context.fillStyle = '#ffcc00';
            context.fillRect(20, 0, 15, 1024);
            context.fillRect(477, 0, 15, 1024);

            const roadTexture = new THREE.CanvasTexture(canvas);
            roadTexture.wrapS = THREE.RepeatWrapping;
            roadTexture.wrapT = THREE.RepeatWrapping;
            roadTexture.repeat.set(1, 10); // Repetir a lo largo de la Z

            const roadGeo = new THREE.PlaneGeometry(roadWidth, 1000);
            const roadMat = new THREE.MeshPhongMaterial({ 
                map: roadTexture,
                side: THREE.DoubleSide
            });
            
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0, -400);
            road.receiveShadow = true;
            
            scene.add(road);
            
            // Terreno verde a los lados
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshPhongMaterial({ color: 0x2d4c1e });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1; // Ligeramente debajo de la carretera
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createEnvironment() {
            // Limpiar entorno previo si existe
            environmentObjects.forEach(obj => scene.remove(obj));
            environmentObjects = [];

            // Añadir árboles/postes iniciales a los lados
            for(let i = 0; i < 40; i++) {
                spawnEnvironmentObject(true);
            }
        }

        function spawnEnvironmentObject(initial = false) {
            // Crear un árbol simple (cono + cilindro)
            const isLeft = Math.random() > 0.5;
            const xPos = isLeft ? -15 - Math.random() * 20 : 15 + Math.random() * 20;
            const zPos = initial ? -Math.random() * 400 : -200 - Math.random() * 50;

            const treeGroup = new THREE.Group();

            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 2);
            const trunkMat = new THREE.MeshPhongMaterial({ color: 0x4a2e00 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(1.5, 4, 8);
            const leavesMat = new THREE.MeshPhongMaterial({ color: 0x0f400f });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 3;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(xPos, 0, zPos);
            scene.add(treeGroup);
            environmentObjects.push(treeGroup);
        }

        function spawnObstacle() {
            // No generar si el juego no está activo
            if(gameState !== 'playing') return;

            // Crear un coche "civil" como obstáculo
            const obsGroup = new THREE.Group();
            
            const colors = [0x0000cc, 0x00cc00, 0xcc9900, 0xffffff, 0x555555, 0x8800ff];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const bodyMat = new THREE.MeshPhongMaterial({ color: color, shininess: 80 });
            const glassMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 90 });
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
            
            // Chasis principal del coche obstáculo
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.7, 4);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.55;
            body.castShadow = true;
            obsGroup.add(body);

            // Cabina (ventanas)
            const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 2);
            const cabin = new THREE.Mesh(cabinGeo, glassMat);
            cabin.position.set(0, 1.15, -0.2);
            cabin.castShadow = true;
            obsGroup.add(cabin);

            // Ruedas del obstáculo
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            
            const wheelPositions = [
                [-1.0, 0.35, -1.2], // Delantera Izquierda
                [ 1.0, 0.35, -1.2], // Delantera Derecha
                [-1.0, 0.35,  1.2], // Trasera Izquierda
                [ 1.0, 0.35,  1.2]  // Trasera Derecha
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                obsGroup.add(wheel);
            });

            // Carriles (3 carriles)
            const lanes = [-laneWidth, 0, laneWidth];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            
            // Aparecen a lo lejos
            obsGroup.position.set(lane, 0, -150 - Math.random() * 50);
            
            // Caja de colisión personalizada para optimizar
            obsGroup.collider = new THREE.Box3();
            
            scene.add(obsGroup);
            obstacles.push(obsGroup);
        }

        // --- LÓGICA DEL JUEGO ---

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            uiHUD.classList.remove('hidden');
            touchLeft.classList.remove('hidden');
            touchRight.classList.remove('hidden');
            
            // Ocultar elementos flotantes de inicio
            if(startGroup) startGroup.visible = false;
            
            // Resetear cámara a la posición de juego en tercera persona
            camera.position.set(0, 4, 10);
            camera.lookAt(0, 0, -20);
            
            // Resetear variables
            score = 0;
            speedMultiplier = 1;
            car.position.set(0, 0, 0);
            car.rotation.y = 0;
            
            // Limpiar obstáculos
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            
            createEnvironment();
            
            gameState = 'playing';
        }

        function gameOver() {
            gameState = 'gameover';
            uiHUD.classList.add('hidden');
            touchLeft.classList.add('hidden');
            touchRight.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            
            finalScore.innerHTML = `${Math.floor(score)} <span class="text-xl text-gray-400">m</span>`;
            
            // Animación de choque (rotar coche)
            car.rotation.y = Math.PI / 4;
            car.position.y = 0.5;
        }

        function updatePhysics() {
            if (gameState !== 'playing') return;

            // 1. Acelerar progresivamente
            speedMultiplier += 0.0002; 
            const currentSpeed = baseSpeed * speedMultiplier;
            const cappedSpeed = Math.min(currentSpeed, maxSpeed);
            
            score += cappedSpeed * 0.5;

            // Actualizar UI
            scoreDisplay.innerHTML = `${Math.floor(score)} <span class="text-lg text-gray-300">m</span>`;
            // Calcular km/h falso basado en la velocidad
            const kmh = Math.floor(cappedSpeed * 60);
            speedDisplay.innerHTML = `${kmh} <span class="text-lg text-gray-300">km/h</span>`;

            // 2. Movimiento del jugador (Dirección)
            const turnSpeed = 0.15;
            let moveX = 0;

            if (keys.ArrowLeft || keys.a || touchInput === -1) moveX = -1;
            if (keys.ArrowRight || keys.d || touchInput === 1) moveX = 1;

            car.position.x += moveX * turnSpeed;
            
            // Limitar dentro de la carretera
            const maxLimit = (roadWidth / 2) - 1.5;
            if (car.position.x > maxLimit) car.position.x = maxLimit;
            if (car.position.x < -maxLimit) car.position.x = -maxLimit;

            // Inclinación visual al girar
            const targetRotationY = moveX * -0.15;
            car.rotation.y += (targetRotationY - car.rotation.y) * 0.1;
            const targetRotationZ = moveX * -0.05;
            car.rotation.z += (targetRotationZ - car.rotation.z) * 0.1;

            // Animar ruedas del coche
            car.wheels.forEach(wheel => {
                wheel.rotation.x += cappedSpeed * 0.5; // Girar adelante
                if(wheel.position.z < 0) { // Ruedas delanteras giran con la dirección
                    wheel.rotation.y = moveX * -0.3;
                }
            });

            // 3. Simular movimiento (Mover textura de carretera)
            road.material.map.offset.y -= cappedSpeed * 0.05;

            // 4. Mover entorno (Árboles)
            for (let i = environmentObjects.length - 1; i >= 0; i--) {
                const env = environmentObjects[i];
                env.position.z += cappedSpeed;
                
                // Reciclar si pasa detrás de la cámara
                if (env.position.z > 20) {
                    env.position.z = -200 - Math.random() * 100;
                    env.position.x = (Math.random() > 0.5 ? -1 : 1) * (15 + Math.random() * 20);
                }
            }

            // 5. Mover y gestionar Obstáculos
            // Generador de obstáculos (probabilidad basada en velocidad)
            if (Math.random() < 0.02 * speedMultiplier && obstacles.length < 8) {
                spawnObstacle();
            }

            // Actualizar colisionador del coche principal
            const carBox = new THREE.Box3().setFromObject(car);
            // Reducir un poco el hitbox para ser más permisivo
            carBox.expandByScalar(-0.2); 

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                
                // Los obstáculos se mueven un poco hacia adelante simulando ser coches más lentos
                obs.position.z += cappedSpeed * 0.7; // El jugador los alcanza
                
                // Actualizar su caja de colisión
                obs.collider.setFromObject(obs);
                obs.collider.expandByScalar(-0.2);

                // Check colisión
                if (carBox.intersectsBox(obs.collider)) {
                    gameOver();
                    break;
                }

                // Eliminar si pasa detrás de la cámara
                if (obs.position.z > 20) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }
        }

        // --- BUCLE PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);
            
            if (gameState === 'start') {
                const time = Date.now();
                
                // 1. Animar elementos flotantes de la pantalla de inicio
                if(startGroup && startGroup.visible) {
                    
                    // Animar geometrías
                    startGroup.children.forEach(child => {
                        if (child.userData.rotX !== undefined) { // Es una figura geométrica
                            child.rotation.x += child.userData.rotX;
                            child.rotation.y += child.userData.rotY;
                            // Levitación
                            child.position.y = child.userData.baseY + Math.sin(time * child.userData.floatSpeed + child.userData.floatOffset) * 1.5;
                        }
                    });

                    // Rotar campo de partículas
                    if (startGroup.userData.particles) {
                        startGroup.userData.particles.rotation.y = time * 0.0001;
                    }

                    // Rotar luces de neón alrededor del coche
                    if (startGroup.userData.light1) {
                        startGroup.userData.light1.position.x = Math.cos(time * 0.001) * 6;
                        startGroup.userData.light1.position.z = Math.sin(time * 0.001) * 6;
                        startGroup.userData.light1.position.y = 2 + Math.sin(time * 0.002) * 1;
                        
                        startGroup.userData.light2.position.x = Math.cos(time * 0.001 + Math.PI) * 6;
                        startGroup.userData.light2.position.z = Math.sin(time * 0.001 + Math.PI) * 6;
                        startGroup.userData.light2.position.y = 2 + Math.cos(time * 0.002) * 1;
                    }
                }
                
                // 2. Cámara cinemática rotando alrededor del coche
                startCameraAngle += 0.004; // Un poco más lento para apreciar el fondo
                camera.position.x = Math.sin(startCameraAngle) * 10;
                camera.position.z = Math.cos(startCameraAngle) * 10;
                camera.position.y = 3 + Math.sin(startCameraAngle * 1.5) * 1.5; 
                camera.lookAt(0, 0.5, 0); // Mirar ligeramente por encima del suelo
                
            } else {
                updatePhysics();
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Arrancar el motor (inicializar cuando cargue la página)
        window.onload = init;

    </script>
</body>
