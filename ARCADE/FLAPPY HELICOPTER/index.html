<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helicóptero Táctico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Fondo oscuro para los bordes */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            touch-action: none;
        }

        /* Contenedor Responsive con Aspect Ratio Fijo (2:3) */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Esta fórmula mágica mantiene siempre la proporción 400x600 sin importar la pantalla */
            max-width: calc(100vh * (400/600));
            max-height: calc(100vw * (600/400));
            background: linear-gradient(to bottom, #2b1d3d 0%, #d96f48 70%, #1a1a1a 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* El canvas escala gráficamente sin alterar sus coordenadas lógicas internas */
        }

        /* Capas de Interfaz (UI) */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(10, 15, 10, 0.9);
            padding: 2rem;
            border: 2px solid #4B5320;
            border-radius: 10px;
            box-shadow: 0 0 20px #4B5320;
            text-align: center;
            pointer-events: auto;
            width: 85%; /* Se adapta al contenedor responsive */
            max-width: 320px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            color: #8F9779;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-shadow: 0 0 5px #000;
        }

        .btn {
            background-color: #4B5320;
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: 15px;
            border-radius: 5px;
            border: 1px solid #78866B;
            width: 100%;
        }

        .btn:hover { background-color: #5d6728; transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        #score-display {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            color: white;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.1s;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.15) 50%,
                rgba(0,0,0,0.15)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.4;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="score-display">0</div>

    <div class="ui-layer">
        <!-- Pantalla d'Inici -->
        <div id="start-screen" class="screen active">
            <h1 class="text-3xl font-bold text-yellow-500 mb-2">HELICÒPTER</h1>
            <h2 class="text-xl font-bold mb-4">Operació Tàctica</h2>
            <p class="text-gray-300 mb-4 text-sm">Toca la pantalla o prem ESPAI per volar.</p>
            <button class="btn" id="start-btn">Iniciar</button>
        </div>

        <!-- Pantalla de Final de Joc -->
        <div id="game-over-screen" class="screen">
            <h1 class="text-3xl font-bold text-red-500">Missió Fallida</h1>
            <div class="text-xl text-white my-2">Puntuació: <span id="final-score" class="text-yellow-400 font-bold">0</span></div>
            <div class="text-md text-gray-300 mb-4">Millor Rècord: <span id="best-score" class="text-yellow-400 font-bold">0</span></div>
            <button class="btn" id="retry-btn">Tornar a intentar</button>
        </div>
    </div>
    
    <div class="scanlines"></div>
</div>

<script>
    // Configuració inicial del Canvas amb RESOLUCIÓ LÒGICA FIXA
    // Això assegura que les físiques funcionin exactament igual en qualsevol dispositiu
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const LOGICAL_WIDTH = 400;
    const LOGICAL_HEIGHT = 600;
    
    canvas.width = LOGICAL_WIDTH;
    canvas.height = LOGICAL_HEIGHT;
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');

    // Botons (Assignats via JS per evitar clics accidentals al canvas)
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', resetGame);

    // Variables del joc
    let frames = 0;
    let score = 0;
    let bestScore = localStorage.getItem('heliBestScore') || 0;
    let currentState = 'START'; 
    let gameLoop;

    // --- ENTITATS DEL JOC ---

    const heli = {
        x: 80,
        y: 300,
        width: 45,
        height: 25,
        velocity: 0,
        // MILLORES DE JUGABILITAT: Físiques més flotants com un helicòpter
        gravity: 0.18, 
        jump: -4.5,    
        terminalVelocity: 7, // Límit de velocitat de caiguda
        rotation: 0,
        radius: 8, // Hitbox MÉS INDULGENT per evitar xocs injustos
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Rotació més suau basada en la velocitat
            this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, (this.velocity * 0.08)));
            ctx.rotate(this.rotation);

            const bodyColor = '#3e4a2e';
            const darkAccent = '#111';
            const windowColor = '#5c94fc';

            // Cuerpo principal
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cabina
            ctx.fillStyle = windowColor;
            ctx.beginPath();
            ctx.arc(10, -2, 7, 0, Math.PI, true);
            ctx.fill();

            // Cola
            ctx.fillStyle = bodyColor;
            ctx.fillRect(-35, -2, 20, 4);
            
            // Estabilizador
            ctx.fillStyle = darkAccent;
            ctx.fillRect(-35, -8, 4, 12);

            // Patines
            ctx.strokeStyle = darkAccent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-10, 10);
            ctx.lineTo(-10, 15);
            ctx.moveTo(10, 10);
            ctx.lineTo(10, 15);
            ctx.stroke();
            ctx.fillStyle = darkAccent;
            ctx.fillRect(-15, 15, 30, 2);

            // Rotor Principal
            ctx.fillStyle = darkAccent;
            ctx.fillRect(-2, -14, 4, 5);
            
            if (currentState === 'PLAY') {
                ctx.fillStyle = frames % 4 < 2 ? 'rgba(255,255,255,0.8)' : 'rgba(68,68,68,0.8)';
                ctx.fillRect(-28, -16, 56, 2);
            } else {
                ctx.fillStyle = '#444';
                ctx.fillRect(-25, -16, 50, 2);
            }

            // Rotor de cola
            if (currentState === 'PLAY') {
                ctx.fillStyle = frames % 4 < 2 ? 'rgba(255,255,255,0.8)' : 'rgba(68,68,68,0.8)';
                ctx.beginPath();
                ctx.arc(-35, -4, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        },
        
        update: function() {
            this.velocity += this.gravity;
            // Limitar velocidad de caída
            if(this.velocity > this.terminalVelocity) {
                this.velocity = this.terminalVelocity;
            }
            this.y += this.velocity;

            // Suelo
            if (this.y + this.height / 2 >= LOGICAL_HEIGHT) {
                this.y = LOGICAL_HEIGHT - this.height / 2;
                if(currentState === 'PLAY') gameOver();
            }
            // Techo
            if (this.y - this.height / 2 <= 0) {
                this.y = this.height / 2;
                this.velocity = 0;
            }
        },

        flap: function() {
            this.velocity = this.jump;
            createExhaust();
        }
    };

    const obstacles = {
        list: [],
        width: 65,
        // MEJORAS DE JUGABILIDAD: Huecos más amplios y movimiento más lento
        gap: 175, 
        dx: 2.2,

        draw: function() {
            for (let i = 0; i < this.list.length; i++) {
                let obs = this.list[i];
                
                ctx.fillStyle = '#4A4A4A';
                
                // Pilar Superior
                ctx.fillRect(obs.x, 0, this.width, obs.top);
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, 0, this.width, obs.top);
                drawHazardStripes(obs.x, obs.top - 20, this.width, 20);

                // Pilar Inferior
                ctx.fillStyle = '#4A4A4A';
                ctx.fillRect(obs.x, LOGICAL_HEIGHT - obs.bottom, this.width, obs.bottom);
                ctx.strokeRect(obs.x, LOGICAL_HEIGHT - obs.bottom, this.width, obs.bottom);
                drawHazardStripes(obs.x, LOGICAL_HEIGHT - obs.bottom, this.width, 20);
            }
        },

        update: function() {
            // Añadir obstáculos con espacio razonable (110 frames = más distancia entre tubos)
            if (frames % 110 === 0) {
                let minHeight = 50;
                let maxHeight = LOGICAL_HEIGHT - this.gap - minHeight;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                
                this.list.push({
                    x: LOGICAL_WIDTH,
                    top: topHeight,
                    bottom: LOGICAL_HEIGHT - (topHeight + this.gap),
                    passed: false
                });
            }

            for (let i = 0; i < this.list.length; i++) {
                let obs = this.list[i];
                obs.x -= this.dx;

                // Colisiones más precisas (usando el radio ajustado)
                if (heli.x + heli.radius > obs.x && heli.x - heli.radius < obs.x + this.width) {
                    if (heli.y - heli.radius < obs.top || heli.y + heli.radius > LOGICAL_HEIGHT - obs.bottom) {
                        gameOver();
                    }
                }

                // Puntuación
                if (obs.x + this.width < heli.x && !obs.passed) {
                    score++;
                    scoreDisplay.innerText = score;
                    obs.passed = true;
                    scoreDisplay.style.transform = "translateX(-50%) scale(1.3)";
                    setTimeout(() => scoreDisplay.style.transform = "translateX(-50%) scale(1)", 150);
                }

                // Limpieza
                if (obs.x + this.width < 0) {
                    this.list.shift();
                    i--;
                }
            }
        },
        reset: function() { this.list = []; }
    };

    function drawHazardStripes(x, y, w, h) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip(); 

        ctx.fillStyle = '#FFCC00';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 10;
        
        for (let i = -w; i < w + h; i += 15) {
            ctx.beginPath();
            ctx.moveTo(x + i, y);
            ctx.lineTo(x + i + h, y + h);
            ctx.stroke();
        }
        ctx.restore();
        
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
    }

    // --- SISTEMA DE PARTÍCULAS ---
    let particles = [];
    
    function createExhaust() {
        particles.push({
            x: heli.x - 20, y: heli.y + 5,
            size: Math.random() * 4 + 2,
            life: 1,
            dx: -Math.random() * 1.5 - 0.5,
            dy: Math.random() * 1 - 0.5,
            color: 'rgba(180, 180, 180, '
        });
    }

    function createExplosion() {
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: heli.x, y: heli.y,
                size: Math.random() * 8 + 2,
                life: 1,
                dx: (Math.random() - 0.5) * 12,
                dy: (Math.random() - 0.5) * 12,
                color: Math.random() > 0.6 ? 'rgba(255, 80, 0, ' : 'rgba(80, 80, 80, '
            });
        }
    }

    function updateParticles() {
        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            p.x += p.dx; p.y += p.dy;
            p.life -= 0.03; 
            p.size += 0.3; 

            ctx.fillStyle = p.color + p.life + ')';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            if (p.life <= 0) {
                particles.splice(i, 1);
                i--;
            }
        }
    }

    // --- FONDO PARALLAX ---
    const city = {
        layer1: [], layer2: [],
        init: function() {
            this.layer1 = []; this.layer2 = [];
            let x1 = 0; let x2 = 0;
            while(x1 < LOGICAL_WIDTH * 2) {
                let w = Math.random() * 40 + 30;
                this.layer1.push({x: x1, w: w, h: Math.random() * 150 + 50});
                x1 += w + 5;
            }
            while(x2 < LOGICAL_WIDTH * 2) {
                let w = Math.random() * 60 + 40;
                this.layer2.push({x: x2, w: w, h: Math.random() * 250 + 100});
                x2 += w + 2;
            }
        },
        draw: function() {
            ctx.fillStyle = '#1e152a';
            for (let b of this.layer2) ctx.fillRect(b.x, LOGICAL_HEIGHT - b.h, b.w, b.h);

            ctx.fillStyle = '#2c223a';
            for (let b of this.layer1) {
                ctx.fillRect(b.x, LOGICAL_HEIGHT - b.h, b.w, b.h);
                if (b.w > 40) {
                    ctx.fillStyle = 'rgba(255,255,200, 0.1)';
                    ctx.fillRect(b.x + 10, LOGICAL_HEIGHT - b.h + 20, 5, 10);
                    ctx.fillRect(b.x + 25, LOGICAL_HEIGHT - b.h + 40, 5, 10);
                    ctx.fillStyle = '#2c223a';
                }
            }
        },
        update: function() {
            for (let i = 0; i < this.layer1.length; i++) {
                let b = this.layer1[i];
                b.x -= 1.5;
                if (b.x + b.w < 0) {
                    let lastB = this.layer1[this.layer1.length - 1];
                    b.x = lastB.x + lastB.w + 5;
                    b.h = Math.random() * 150 + 50;
                    this.layer1.push(this.layer1.shift()); i--;
                }
            }
            for (let i = 0; i < this.layer2.length; i++) {
                let b = this.layer2[i];
                b.x -= 0.5;
                if (b.x + b.w < 0) {
                    let lastB = this.layer2[this.layer2.length - 1];
                    b.x = lastB.x + lastB.w + 2;
                    b.h = Math.random() * 250 + 100;
                    this.layer2.push(this.layer2.shift()); i--;
                }
            }
        }
    };

    // --- CONTROL DEL JUEGO ---
    function draw() {
        ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
        city.draw();
        obstacles.draw();
        updateParticles();
        if(currentState !== 'START') heli.draw();
    }

    function update() {
        if (currentState === 'PLAY') {
            city.update();
            heli.update();
            obstacles.update();
        } else if (currentState === 'OVER') {
            heli.update(); 
        }
    }

    function loop() {
        update();
        draw();
        frames++;
        gameLoop = requestAnimationFrame(loop);
    }

    function startGame() {
        currentState = 'PLAY';
        startScreen.classList.remove('active');
        scoreDisplay.style.display = 'block';
        
        heli.y = LOGICAL_HEIGHT / 2;
        heli.velocity = 0;
        score = 0;
        frames = 0;
        scoreDisplay.innerText = score;
        obstacles.reset();
        city.init();
        particles = [];
        heli.flap(); 
    }

    function gameOver() {
        if (currentState === 'OVER') return; 
        
        currentState = 'OVER';
        createExplosion();
        
        // Efecto sacudida usando CSS Transform en el contenedor principal
        const container = document.getElementById('game-container');
        container.style.transform = "translate(10px, 10px)";
        setTimeout(() => container.style.transform = "translate(-10px, -10px)", 50);
        setTimeout(() => container.style.transform = "translate(10px, -10px)", 100);
        setTimeout(() => container.style.transform = "translate(0, 0)", 150);

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('heliBestScore', bestScore);
        }

        setTimeout(() => {
            finalScoreEl.innerText = score;
            bestScoreEl.innerText = bestScore;
            gameOverScreen.classList.add('active');
            scoreDisplay.style.display = 'none';
        }, 600); 
    }

    function resetGame() {
        gameOverScreen.classList.remove('active');
        startGame();
    }

    // --- CONTROLES ---
    function handleInput(e) {
        // Prevenir comportamiento por defecto (como el scroll en móviles)
        // excepto si se está clickeando un botón de la UI
        if (e.target.tagName === 'BUTTON') return; 
        
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type !== 'keydown') e.preventDefault(); 

        if (currentState === 'PLAY') {
            heli.flap();
        } else if (currentState === 'START') {
            startGame();
        }
    }

    // Event listeners al documento/ventana para capturar clics donde sea
    window.addEventListener('keydown', handleInput);
    document.getElementById('game-container').addEventListener('mousedown', handleInput);
    document.getElementById('game-container').addEventListener('touchstart', handleInput, { passive: false });

    // Iniciar loop visual
    city.init();
    loop();

</script>
</body>
</html>
